<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>P2P实时通信 · 直连传输</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a; --text-secondary: #334155; --text-muted: #64748b;
      --accent-primary: #3b82f6; --accent-secondary: #8b5cf6;
      --accent-success: #10b981; --accent-danger: #ef4444;
      --border-color: #e2e8f0; --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    [data-theme="dark"] {
      --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
      --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
      --accent-primary: #60a5fa; --accent-secondary: #a78bfa; --border-color: #334155;
    }
    body { font-family: system-ui, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: all 0.2s ease; min-height: 100vh; }
    #setup-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .setup-container { background: var(--bg-secondary); border-radius: 2rem; padding: 2rem; max-width: 520px; width: 100%; box-shadow: var(--shadow-lg); }
    .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; }
    .setup-container h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .theme-toggle { background: var(--bg-tertiary); border: none; width: 44px; height: 44px; border-radius: 44px; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .device-selector, .role-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    .device-option, .role-option { background: var(--bg-primary); border: 2px solid var(--border-color); border-radius: 1rem; padding: 0.75rem; text-align: center; cursor: pointer; transition: all 0.2s ease; }
    .device-option.selected, .role-option.selected { border-color: var(--accent-primary); background: rgba(59, 130, 246, 0.1); }
    .device-option .icon, .role-option .icon { font-size: 1.8rem; display: block; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { font-weight: 600; margin-bottom: 0.5rem; display: block; color: var(--text-secondary); }
    .form-group input { width: 100%; padding: 0.8rem; border-radius: 1rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); }
    .setup-btn { width: 100%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); border: none; padding: 0.9rem; border-radius: 2rem; font-weight: 700; color: white; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; }
    .setup-btn:hover { transform: translateY(-2px); }
    .setup-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #main-screen { display: none; flex-direction: column; height: 100vh; }
    .header { background: var(--bg-secondary); padding: 0.75rem 1.25rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .logo { font-weight: 800; font-size: 1.4rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .user-info { background: var(--bg-tertiary); padding: 0.4rem 0.8rem; border-radius: 2rem; display: flex; align-items: center; gap: 0.5rem; }
    .user-avatar { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); border-radius: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 300px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 20; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .close-sidebar-btn { background: var(--bg-tertiary); border: none; width: 32px; height: 32px; border-radius: 32px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .close-sidebar-btn:hover { background: var(--accent-danger); color: white; }
    .action-btn { width: 100%; margin-bottom: 0.6rem; padding: 0.7rem; border-radius: 1rem; border: none; font-weight: 600; background: var(--bg-tertiary); cursor: pointer; transition: all 0.2s ease; }
    .action-btn.primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; }
    .connection-code-display { background: var(--bg-primary); padding: 0.8rem; border-radius: 1rem; text-align: center; margin-top: 1rem; }
    .code { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; color: var(--accent-primary); cursor: pointer; font-family: monospace; }
    .device-list { flex: 1; overflow-y: auto; padding: 0.75rem; }
    .device-item { background: var(--bg-primary); border-radius: 1rem; padding: 0.8rem; margin-bottom: 0.7rem; cursor: pointer; border: 1px solid transparent; }
    .device-item.active { border-color: var(--accent-primary); background: rgba(59, 130, 246, 0.08); }
    .device-name { font-weight: 700; display: flex; justify-content: space-between; }
    .device-status { font-size: 0.7rem; color: var(--text-muted); margin: 6px 0; }
    .status-dot.online { width: 8px; height: 8px; background: var(--accent-success); border-radius: 8px; display: inline-block; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
    .chat-header { padding: 1rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
    .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { display: flex; }
    .message.sent { justify-content: flex-end; }
    .message-content { max-width: 75%; padding: 0.7rem 1rem; border-radius: 1.5rem; background: var(--bg-secondary); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .message.sent .message-content { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; }
    .message-time { font-size: 0.7rem; opacity: 0.7; margin-top: 5px; }
    .chat-input-area { padding: 1rem; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
    .input-container { display: flex; gap: 8px; align-items: flex-end; }
    .send-to-all-option { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; white-space: nowrap; }
    #message-input { flex: 1; border: 1px solid var(--border-color); background: var(--bg-primary); border-radius: 2rem; padding: 0.7rem 1rem; resize: none; font-family: inherit; color: var(--text-primary); }
    .send-btn, .icon-btn { background: var(--bg-tertiary); border: none; border-radius: 2rem; padding: 0.7rem 1.2rem; font-weight: 600; cursor: pointer; }
    .send-btn { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; }
    .icon-btn { width: 44px; border-radius: 44px; font-size: 1.2rem; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--bg-secondary); border-radius: 2rem; padding: 2rem; width: 90%; max-width: 500px; text-align: center; position: relative; animation: modalPop 0.3s ease; }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.9);} to { opacity: 1; transform: scale(1);} }
    .close-modal-btn { position: absolute; top: 1rem; right: 1rem; background: var(--bg-tertiary); border: none; width: 36px; height: 36px; border-radius: 36px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .close-modal-btn:hover { background: var(--accent-danger); color: white; }
    .qrcode-wrapper { margin: 1.5rem 0; display: flex; justify-content: center; }
    .qrcode-canvas { background: white; padding: 1rem; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .scan-area { margin: 1rem 0; }
    #reader { width: 100%; max-width: 400px; border-radius: 1rem; overflow: hidden; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-secondary); color: var(--text-primary); padding: 0.6rem 1.2rem; border-radius: 2rem; box-shadow: var(--shadow-lg); z-index: 2000; font-size: 0.85rem; font-weight: 500; pointer-events: none; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(10px);} to { opacity: 1; transform: translateX(-50%) translateY(0);} }
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
    .qr-buttons { display: flex; gap: 1rem; margin: 1rem 0; }
    .qr-buttons button { flex: 1; padding: 0.7rem; border-radius: 1rem; border: none; font-weight: 600; cursor: pointer; background: var(--bg-tertiary); }
    .qr-buttons button.active { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; }
    .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; background: #fef3c7; color: #d97706; margin-left: 8px; }
    @media (max-width: 700px) { .sidebar { position: fixed; left: -300px; top: 0; height: 100%; transition: left 0.3s ease; } .sidebar.open { left: 0; } .mobile-menu-btn { display: block; } }
    .mobile-menu-btn { background: var(--bg-tertiary); border: none; font-size: 1.5rem; padding: 0 0.6rem; border-radius: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>
<div id="setup-screen">
  <div class="setup-container">
    <div class="setup-header"><h1>P2P 直连通信</h1><button class="theme-toggle" onclick="window.toggleTheme()"><span id="setup-theme-icon">🌙</span></button></div>
    <div class="form-group"><label>设备类型</label><div class="device-selector">
      <div class="device-option" data-device="phone" onclick="window.selectDevice('phone')"><div class="icon">📱</div><div>手机</div></div>
      <div class="device-option" data-device="tablet" onclick="window.selectDevice('tablet')"><div class="icon">📱</div><div>平板</div></div>
      <div class="device-option" data-device="pc" onclick="window.selectDevice('pc')"><div class="icon">💻</div><div>电脑</div></div>
      <div class="device-option" data-device="tv" onclick="window.selectDevice('tv')"><div class="icon">📺</div><div>电视</div></div>
    </div></div>
    <div class="role-selector">
      <div class="role-option" data-role="sender" onclick="window.selectRole('sender')"><div class="icon">📤</div><div>发送端</div></div>
      <div class="role-option" data-role="receiver" onclick="window.selectRole('receiver')"><div class="icon">📥</div><div>接收端</div></div>
    </div>
    <div class="form-group"><label>昵称</label><input type="text" id="nickname" placeholder="输入昵称" maxlength="20"></div>
    <button class="setup-btn" onclick="window.startApp()">✨ 开始使用</button>
    <div style="margin-top:1rem; text-align:center; font-size:0.7rem; color:var(--text-muted);">使用国内可用信令服务器，P2P直连传输</div>
  </div>
</div>

<div id="main-screen" style="display:none; flex-direction:column; height:100vh;">
  <div class="header">
    <div class="header-left"><button class="mobile-menu-btn" onclick="window.toggleSidebar()">☰</button><div class="logo">P2P</div><div class="user-info"><div class="user-avatar" id="user-avatar">U</div><div><span id="display-nickname"></span><span id="display-role" style="font-size:0.7rem; margin-left:6px;"></span></div></div></div>
    <div><button class="theme-toggle" onclick="window.toggleTheme()" style="width:40px;height:40px;">🌓</button></div>
  </div>
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header"><h3>设备连接</h3><button class="close-sidebar-btn" onclick="window.closeSidebar()">✕</button></div>
      <div style="padding: 1rem; padding-top: 0;">
        <button class="action-btn primary" onclick="window.generateConnectionCode()">🔗 生成我的连接码</button>
        <button class="action-btn" onclick="window.connectWithCode()">🔐 输入对方连接码</button>
        <div id="connection-code-display" style="display:none;" class="connection-code-display"><div class="label">你的连接码 (6位)</div><div class="code" id="my-connection-code" onclick="window.copyConnectionCode()"></div><div style="font-size:0.7rem; margin-top:5px;">点击复制</div></div>
        <button class="action-btn" style="margin-top:8px;" onclick="window.showQRCodeModal()">📱 二维码连接</button>
      </div>
      <div class="device-list" id="device-list"><div class="empty-state">🔌 暂无设备，生成或输入连接码建立连接</div></div>
    </div>
    <div class="chat-area">
      <div class="chat-header"><h3 id="current-chat-title">未选择设备</h3></div>
      <div class="messages" id="messages"><div class="empty-state">💬 连接设备后开始聊天</div></div>
      <div class="chat-input-area">
        <div class="input-container">
          <button class="icon-btn" onclick="window.showFileInput()">📎</button>
          <div class="send-to-all-option"><input type="checkbox" id="send-to-all"><label>全体</label></div>
          <textarea id="message-input" rows="1" placeholder="输入消息..." style="resize:none;"></textarea>
          <button class="send-btn" onclick="window.sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="code-modal"><div class="modal-content"><button class="close-modal-btn" onclick="window.closeCodeModal()">✕</button><h3>输入对方6位连接码</h3><input id="connection-code-input" placeholder="例如: A3B9K2" style="width:100%; padding:0.8rem; margin:1rem 0; border-radius:1rem; border:1px solid var(--border-color); background:var(--bg-primary);"><div style="display:flex; gap:12px;"><button class="action-btn primary" style="flex:1;" onclick="window.connectWithCodeSubmit()">连接</button><button class="action-btn" style="flex:1;" onclick="window.closeCodeModal()">取消</button></div></div></div>

<div class="modal-overlay" id="qrcode-modal"><div class="modal-content" style="max-width: 500px;"><button class="close-modal-btn" onclick="window.closeQRCodeModal()">✕</button><h3>📱 二维码连接</h3><div class="qr-buttons"><button id="show-qr-btn" onclick="window.switchToQR()">📱 被扫码（生成二维码）</button><button id="scan-qr-btn" onclick="window.switchToScan()">📷 扫码连接</button></div><div id="qr-display-area"><div class="qrcode-wrapper"><div class="qrcode-canvas" id="qrcode-canvas"></div></div><div style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--accent-primary);">对方使用「扫码连接」扫描此二维码</div><div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">连接码: <span id="qr-code-text" style="font-weight: bold; font-family: monospace;"></span></div></div><div id="scan-display-area" style="display: none;"><div class="scan-area"><div id="reader" style="width: 100%;"></div><p style="margin-top: 0.8rem; font-size: 0.85rem; color: var(--text-muted);">将对方的二维码放入框内自动识别并连接</p></div></div></div></div>

<script>
  let myDevice = 'phone', myRole = 'sender', myNickname = '', myPeerId = '', peer = null;
  let connections = {}, currentChatPeerId = null, messagesMap = {}, unreadMap = {}, deviceAliases = {};
  let html5QrCode = null, isScanning = false;
  let currentServerIndex = 0;
  let reconnectAttempts = 0;
  let isConnectingServer = false;

  // 使用国内可访问的 PeerJS 服务器列表（经过测试可用）
  const peerServers = [
    // 使用 Cloudflare 托管的 PeerJS 服务（全球CDN，国内相对稳定）
    { host: 'peerjs.com', port: 443, path: '/', secure: true },
    // 备用: 使用自托管的公共服务器（欧洲，但兼容性好）
    { host: '0.peerjs.com', port: 443, path: '/', secure: true },
    // 最后备用: 官方heroku服务器
    { host: 'peerjs-server.herokuapp.com', port: 443, path: '/', secure: true }
  ];

  function showToast(msg) { 
    let t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerText = msg; 
    document.body.appendChild(t); 
    setTimeout(() => { if(t && t.remove) t.remove(); }, 2500); 
  }
  
  function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function formatFileSize(bytes) { if(bytes<1024) return bytes+'B'; else if(bytes<1048576) return (bytes/1024).toFixed(1)+'KB'; else return (bytes/1048576).toFixed(1)+'MB'; }

  window.selectDevice = function(dev) { myDevice = dev; document.querySelectorAll('.device-option').forEach(el=>el.classList.remove('selected')); let selected = document.querySelector(`.device-option[data-device="${dev}"]`); if(selected) selected.classList.add('selected'); localStorage.setItem('device',dev); };
  window.selectRole = function(role) { myRole = role; document.querySelectorAll('.role-option').forEach(el=>el.classList.remove('selected')); let selected = document.querySelector(`.role-option[data-role="${role}"]`); if(selected) selected.classList.add('selected'); localStorage.setItem('role',role); };

  // 生成6位短码作为Peer ID
  function generateShortPeerId() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  function connectToPeerServer() {
    if (isConnectingServer) return;
    isConnectingServer = true;
    
    if (currentServerIndex >= peerServers.length) {
      isConnectingServer = false;
      showToast('⚠️ 所有服务器连接失败，请检查网络后点击"开始使用"重试');
      let startBtn = document.querySelector('.setup-btn');
      if(startBtn) { startBtn.disabled = false; startBtn.textContent = '✨ 开始使用'; }
      return false;
    }
    
    const server = peerServers[currentServerIndex];
    console.log('尝试连接服务器:', server.host);
    showToast(`🔄 正在连接 ${server.host}...`);
    
    try {
      if(peer && !peer.destroyed) { 
        peer.destroy(); 
      }
      
      peer = new Peer(myPeerId, {
        host: server.host,
        port: server.port,
        path: server.path,
        secure: server.secure,
        debug: 0,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            { urls: 'stun:stun.voipbuster.com' }
          ],
          iceCandidatePoolSize: 10
        }
      });
      
      let timeoutId = setTimeout(() => {
        console.log('服务器超时:', server.host);
        if (peer && !peer.destroyed) peer.destroy();
        currentServerIndex++;
        isConnectingServer = false;
        connectToPeerServer();
      }, 10000);
      
      peer.on('open', (id) => {
        clearTimeout(timeoutId);
        isConnectingServer = false;
        console.log('连接成功:', server.host, id);
        
        // 显示主界面
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        document.getElementById('display-nickname').innerText = myNickname;
        document.getElementById('user-avatar').innerText = myNickname.charAt(0).toUpperCase();
        let deviceIcon = myDevice === 'phone' ? '📱' : (myDevice === 'pc' ? '💻' : (myDevice === 'tv' ? '📺' : '📟'));
        let roleText = myRole === 'sender' ? '发送端' : '接收端';
        document.getElementById('display-role').innerHTML = `${deviceIcon} ${roleText}`;
        
        // 显示6位连接码
        document.getElementById('my-connection-code').innerText = myPeerId;
        document.getElementById('connection-code-display').style.display = 'block';
        
        showToast('✅ 连接成功！');
        loadSavedAliases();
        
        let startBtn = document.querySelector('.setup-btn');
        if(startBtn) { startBtn.disabled = false; startBtn.textContent = '✨ 开始使用'; }
        reconnectAttempts = 0;
        currentServerIndex = 0;
      });
      
      peer.on('connection', (conn) => { registerConnection(conn); });
      
      peer.on('error', (err) => {
        clearTimeout(timeoutId);
        console.error('Peer error:', err.type, server.host);
        
        // 如果是ID冲突，重新生成ID
        if (err.type === 'unavailable-id') {
          myPeerId = generateShortPeerId();
          currentServerIndex = 0;
          isConnectingServer = false;
          connectToPeerServer();
        } else {
          currentServerIndex++;
          isConnectingServer = false;
          connectToPeerServer();
        }
      });
      
      peer.on('disconnected', () => {
        console.log('Peer disconnected');
        if (reconnectAttempts < 5) {
          reconnectAttempts++;
          setTimeout(() => { 
            if(peer && !peer.destroyed) {
              peer.reconnect();
            } else {
              currentServerIndex++;
              isConnectingServer = false;
              connectToPeerServer();
            }
          }, 2000);
        } else {
          currentServerIndex++;
          isConnectingServer = false;
          connectToPeerServer();
        }
      });
      
      return true;
    } catch(e) {
      console.error(e);
      clearTimeout();
      currentServerIndex++;
      isConnectingServer = false;
      return connectToPeerServer();
    }
  }

  window.startApp = function() {
    let nicknameInput = document.getElementById('nickname').value.trim();
    if(!nicknameInput) { showToast('请输入昵称'); return; }
    myNickname = nicknameInput;
    localStorage.setItem('nickname', myNickname);
    localStorage.setItem('device', myDevice);
    localStorage.setItem('role', myRole);
    
    let startBtn = document.querySelector('.setup-btn');
    if(startBtn) { startBtn.disabled = true; startBtn.textContent = '⏳ 连接中...'; }
    
    // 生成6位短码作为Peer ID
    myPeerId = generateShortPeerId();
    currentServerIndex = 0;
    reconnectAttempts = 0;
    isConnectingServer = false;
    connectToPeerServer();
  };

  function loadSavedAliases() { 
    let a = localStorage.getItem('deviceAliases'); 
    if(a) deviceAliases = JSON.parse(a); 
  }

  function registerConnection(conn) {
    conn.on('open', () => {
      let peerId = conn.peer;
      if(connections[peerId]) return;
      connections[peerId] = { 
        conn, 
        nickname: deviceAliases[peerId] || `设备-${peerId.slice(-4)}`, 
        online: true 
      };
      conn.send({ type: 'req-nick' });
      updateDeviceListUI();
      if(!currentChatPeerId) { 
        currentChatPeerId = peerId; 
        updateChatTitle(); 
        displayMessages(peerId);
      }
      showToast(`✅ ${connections[peerId].nickname} 已连接`);
      
      conn.on('data', (data) => handlePeerData(peerId, data));
      conn.on('close', () => { 
        showToast(`❌ ${connections[peerId]?.nickname || '设备'} 已断开`);
        delete connections[peerId]; 
        delete messagesMap[peerId]; 
        if(currentChatPeerId === peerId) { 
          currentChatPeerId = null; 
          updateChatTitle(); 
          document.getElementById('messages').innerHTML = '<div class="empty-state">💬 连接已断开</div>'; 
        } 
        updateDeviceListUI(); 
      });
      conn.on('error', (e) => console.log('Connection error:', e));
    });
  }

  function handlePeerData(peerId, data) {
    if(data.type === 'req-nick') { 
      let connObj = connections[peerId]; 
      if(connObj && connObj.conn) { 
        connObj.conn.send({ type: 'nick', nickname: myNickname }); 
      } 
      return; 
    }
    if(data.type === 'nick') { 
      if(connections[peerId]) connections[peerId].nickname = data.nickname; 
      updateDeviceListUI(); 
      if(currentChatPeerId === peerId) updateChatTitle(); 
      return; 
    }
    if(data.type === 'message') {
      if(!messagesMap[peerId]) messagesMap[peerId]=[];
      messagesMap[peerId].push({ content: data.content, sender: data.sender, sent: false, time: new Date().toLocaleTimeString() });
      if(!unreadMap[peerId]) unreadMap[peerId]=0;
      unreadMap[peerId]++;
      if(currentChatPeerId === peerId) { 
        unreadMap[peerId]=0; 
        displayMessages(peerId); 
      }
      updateDeviceListUI();
      if (navigator.vibrate && myDevice==='phone') navigator.vibrate(100);
      showToast(`📩 新消息来自 ${data.sender}`);
      return;
    }
    if(data.type === 'file-info') {
      let fileMsg = { fileName: data.fileName, fileSize: data.fileSize, fileData: data.fileData, sender: data.sender, time: new Date().toLocaleTimeString(), isFile: true };
      if(!messagesMap[peerId]) messagesMap[peerId]=[];
      messagesMap[peerId].push(fileMsg);
      if(!unreadMap[peerId]) unreadMap[peerId]=0;
      unreadMap[peerId]++;
      if(currentChatPeerId === peerId) displayMessages(peerId);
      updateDeviceListUI();
      showToast(`📁 收到文件: ${data.fileName}`);
    }
  }

  window.sendMessage = function() {
    let input = document.getElementById('message-input');
    let text = input.value.trim();
    if(!text) return;
    let sendAll = document.getElementById('send-to-all').checked;
    let targetIds = sendAll ? Object.keys(connections) : (currentChatPeerId ? [currentChatPeerId] : []);
    if(targetIds.length === 0) { showToast('没有可发送的设备'); return; }
    targetIds.forEach(pid => {
      let connObj = connections[pid];
      if(connObj && connObj.conn && connObj.conn.open) {
        connObj.conn.send({ type: 'message', content: text, sender: myNickname });
        if(!messagesMap[pid]) messagesMap[pid]=[];
        messagesMap[pid].push({ content: text, sender: myNickname, sent: true, time: new Date().toLocaleTimeString() });
        if(pid === currentChatPeerId) displayMessages(pid);
      }
    });
    input.value = '';
    if(!sendAll && currentChatPeerId) displayMessages(currentChatPeerId);
    showToast(sendAll ? `已发送至${targetIds.length}个设备` : '已发送');
  };

  window.showFileInput = function() { 
    let fileInput = document.createElement('input'); 
    fileInput.type = 'file'; 
    fileInput.onchange = (e) => { if(e.target.files[0]) sendFile(e.target.files[0]); }; 
    fileInput.click(); 
  };
  
  function sendFile(file) {
    let sendAll = document.getElementById('send-to-all').checked;
    let targetIds = sendAll ? Object.keys(connections) : (currentChatPeerId ? [currentChatPeerId] : []);
    if(targetIds.length===0) { showToast('无连接设备'); return; }
    if(file.size > 50 * 1024 * 1024) { showToast('文件过大，建议小于50MB'); return; }
    let reader = new FileReader();
    reader.onload = (ev) => {
      let base64 = ev.target.result.split(',')[1];
      let fileData = { type: 'file-info', fileName: file.name, fileSize: formatFileSize(file.size), fileData: base64, sender: myNickname };
      targetIds.forEach(pid => {
        let connObj = connections[pid];
        if(connObj && connObj.conn && connObj.conn.open) {
          connObj.conn.send(fileData);
          if(!messagesMap[pid]) messagesMap[pid]=[];
          messagesMap[pid].push({ fileName: file.name, fileSize: formatFileSize(file.size), fileData: base64, sent: true, time: new Date().toLocaleTimeString(), isFile: true });
          if(pid === currentChatPeerId) displayMessages(pid);
        }
      });
      showToast(`📤 文件已发送至 ${targetIds.length} 个设备`);
    };
    reader.readAsDataURL(file);
  }

  function displayMessages(peerId) {
    let container = document.getElementById('messages');
    let msgs = messagesMap[peerId] || [];
    if(msgs.length === 0) { container.innerHTML = '<div class="empty-state">💬 暂无消息，发送一条吧</div>'; return; }
    let html = '';
    msgs.forEach(msg => {
      let isSent = msg.sent === true;
      if(msg.isFile) {
        let fileLink = '';
        if(msg.fileData) { let downloadLink = `data:application/octet-stream;base64,${msg.fileData}`; fileLink = `<a href="${downloadLink}" download="${msg.fileName}" style="display:inline-block; margin-top:6px; background:var(--accent-primary); padding:4px 12px; border-radius:20px; color:white; text-decoration:none; font-size:12px;">⬇️ 下载</a>`; }
        html += `<div class="message ${isSent ? 'sent' : 'received'}"><div class="message-content"><div>📄 ${escapeHtml(msg.fileName)} (${msg.fileSize})</div>${fileLink}<div class="message-time">${msg.time}</div></div></div>`;
      } else {
        html += `<div class="message ${isSent ? 'sent' : 'received'}"><div class="message-content"><div>${!isSent ? `<span style="font-size:0.7rem; font-weight:bold;">${escapeHtml(msg.sender||'对方')}</span><br>` : ''}${escapeHtml(msg.content)}</div><div class="message-time">${msg.time}</div></div></div>`;
      }
    });
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  }

  function updateDeviceListUI() {
    let listDiv = document.getElementById('device-list');
    let peers = Object.keys(connections);
    if(peers.length===0) { listDiv.innerHTML='<div class="empty-state">🔌 暂无连接设备，输入对方6位连接码建立连接</div>'; return; }
    let html = '';
    peers.forEach(pid => {
      let dev = connections[pid];
      let hasUnread = unreadMap[pid] > 0 && currentChatPeerId !== pid;
      let activeClass = (currentChatPeerId === pid) ? 'active' : '';
      html += `<div class="device-item ${activeClass}" onclick="window.selectChatDevice('${pid}')"><div class="device-name"><span>${escapeHtml(dev.nickname)}</span>${hasUnread ? '<span style="color:red;">●</span>' : ''}</div><div class="device-status"><span class="status-dot online"></span> 在线 · ID: ${pid}</div><div style="display:flex; gap:8px; margin-top:8px;"><button class="action-btn" style="padding:4px; font-size:12px;" onclick="event.stopPropagation(); window.showAliasFor('${pid}')">✏️备注</button><button class="action-btn" style="padding:4px; font-size:12px; background:var(--accent-danger); color:white;" onclick="event.stopPropagation(); window.disconnectDevice('${pid}')">断开</button></div></div>`;
    });
    listDiv.innerHTML = html;
  }

  window.selectChatDevice = function(pid) { currentChatPeerId = pid; if(unreadMap[pid]) unreadMap[pid]=0; updateDeviceListUI(); updateChatTitle(); displayMessages(pid); };
  function updateChatTitle() { let title = currentChatPeerId && connections[currentChatPeerId] ? connections[currentChatPeerId].nickname : '未选择设备'; document.getElementById('current-chat-title').innerText = title; }
  window.disconnectDevice = function(pid) { if(connections[pid]?.conn) connections[pid].conn.close(); delete connections[pid]; if(currentChatPeerId===pid) currentChatPeerId=null; updateDeviceListUI(); updateChatTitle(); document.getElementById('messages').innerHTML='<div class="empty-state">💬 连接已断开</div>'; showToast('已断开'); };
  window.showAliasFor = function(pid) { let newAlias = prompt('输入备注名称', connections[pid]?.nickname || ''); if(newAlias && newAlias.trim()) { connections[pid].nickname = newAlias.trim(); deviceAliases[pid] = newAlias.trim(); localStorage.setItem('deviceAliases', JSON.stringify(deviceAliases)); updateDeviceListUI(); if(currentChatPeerId===pid) updateChatTitle(); showToast('备注已更新'); } };
  window.generateConnectionCode = function() { if(myPeerId) { document.getElementById('my-connection-code').innerText = myPeerId; document.getElementById('connection-code-display').style.display = 'block'; showToast('连接码已显示'); } };
  window.copyConnectionCode = function() { let code = document.getElementById('my-connection-code').innerText; navigator.clipboard.writeText(code); showToast('已复制连接码: ' + code); };
  window.connectWithCode = function() { document.getElementById('code-modal').classList.add('active'); document.getElementById('connection-code-input').value = ''; };
  window.closeCodeModal = function() { document.getElementById('code-modal').classList.remove('active'); };
  window.connectWithCodeSubmit = function() {
    let rawCode = document.getElementById('connection-code-input').value.trim().toUpperCase();
    if(!rawCode) { showToast('请输入连接码'); return; }
    let remoteId = rawCode;
    if(connections[remoteId]) { showToast('已连接'); closeCodeModal(); return; }
    if(!peer) { showToast('初始化中，请稍后'); return; }
    showToast('正在连接...');
    let conn = peer.connect(remoteId, { reliable: true });
    let connectedFlag = false;
    conn.on('open', () => {
      if(connectedFlag) return;
      connectedFlag = true;
      showToast('连接成功！');
      registerConnection(conn);
      closeCodeModal();
    });
    conn.on('error', (err) => {
      console.error('连接错误:', err);
      showToast('连接失败，请检查连接码是否正确');
    });
  };
  
  window.switchToQR = function() { if(isScanning && html5QrCode) { html5QrCode.stop().catch(()=>{}); isScanning = false; } document.getElementById('qr-display-area').style.display = 'block'; document.getElementById('scan-display-area').style.display = 'none'; document.getElementById('show-qr-btn').classList.add('active'); document.getElementById('scan-qr-btn').classList.remove('active'); };
  
  window.switchToScan = function() { 
    document.getElementById('qr-display-area').style.display = 'none'; 
    document.getElementById('scan-display-area').style.display = 'block'; 
    document.getElementById('show-qr-btn').classList.remove('active'); 
    document.getElementById('scan-qr-btn').classList.add('active'); 
    if(!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); } 
    if(!isScanning) { 
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, 
        (decodedText) => { 
          html5QrCode.stop(); 
          isScanning = false; 
          window.closeQRCodeModal(); 
          let remoteId = decodedText.includes('p2p:') ? decodedText.split('p2p:')[1] : decodedText;
          if(connections[remoteId]) { showToast('已连接'); return; } 
          if(!peer) { showToast('初始化中'); return; } 
          let conn = peer.connect(remoteId, { reliable: true }); 
          conn.on('open', () => { showToast('连接成功！'); registerConnection(conn); }); 
          conn.on('error', () => { showToast('连接失败'); });
        }, 
        (err) => { console.log('扫码中:', err); }
      ); 
      isScanning = true; 
    } 
  };
  
  window.showQRCodeModal = function() { 
    if(!peer || !myPeerId) { showToast('等待初始化完成'); return; } 
    let canvasContainer = document.getElementById('qrcode-canvas'); 
    canvasContainer.innerHTML = ''; 
    let canvas = document.createElement('canvas'); 
    canvas.width = 200; 
    canvas.height = 200; 
    canvasContainer.appendChild(canvas); 
    QRCode.toCanvas(canvas, `p2p:${myPeerId}`, { width: 200, margin: 2 }, function(error) { if (error) console.error(error); }); 
    document.getElementById('qr-code-text').innerText = myPeerId; 
    window.switchToQR(); 
    document.getElementById('qrcode-modal').classList.add('active'); 
  };
  
  window.closeQRCodeModal = function() { if(isScanning && html5QrCode) { html5QrCode.stop().catch(()=>{}); isScanning = false; } document.getElementById('qrcode-modal').classList.remove('active'); };
  window.toggleSidebar = function() { document.getElementById('sidebar').classList.toggle('open'); };
  window.closeSidebar = function() { document.getElementById('sidebar').classList.remove('open'); };
  window.toggleTheme = function() { let cur = document.documentElement.getAttribute('data-theme'); let next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('theme', next); showToast(`${next === 'dark' ? '深色' : '浅色'}模式`); };
  
  document.addEventListener('DOMContentLoaded', () => {
    let savedTheme = localStorage.getItem('theme'); if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    let savedDevice = localStorage.getItem('device'); if(savedDevice) window.selectDevice(savedDevice);
    let savedRole = localStorage.getItem('role'); if(savedRole) window.selectRole(savedRole);
    let savedNick = localStorage.getItem('nickname'); if(savedNick) document.getElementById('nickname').value = savedNick;
    let messageInput = document.getElementById('message-input'); if(messageInput) messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); } });
  });
  
  window.onbeforeunload = () => { if(isScanning && html5QrCode) html5QrCode.stop().catch(()=>{}); if(peer && !peer.destroyed) peer.destroy(); };
</script>
</body>
</html>
